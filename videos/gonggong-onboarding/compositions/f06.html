        const S = 1080 / 2880
        const S2 = 530 / 2880

        // Hide developer-only content of the screenshot (group names, branches, command line) behind matching patches.
        const patches = [
          [820, 10, 440, 84, '#d9d9d9', '<b>双十一活动群</b><span>4 人 · 1 Bot</span>'],

          [284, 1004, 200, 40, '#c9c9c9'],
          [744, 1568, 490, 52, '#d9d9d9'],
          [1108, 842, 830, 190, '#ffffff'],
        ]
        const z1 = document.querySelector('#f06-z1')
        patches.forEach(([x, y, w, h, bg, html]) => {
          const d = document.createElement('div')
          d.className = 'pt'
          Object.assign(d.style, { left: `${x * S}px`, top: `${y * S}px`, width: `${w * S}px`, height: `${h * S}px`, background: bg, paddingLeft: '2px', fontSize: `${28 * S}px`, lineHeight: 1.35 })
          if (html) d.innerHTML = html
          z1.insertBefore(d, document.querySelector('#f06-r1'))
        })

        GG.ring('#f06-r1', S, [182, 1212, 512, 48], 10)
        GG.ring('#f06-r2', S, [954, 1184, 352, 32], 8)
        GG.ring('#f06-r3', S, [1110, 690, 234, 50], 8)
        GG.ring('#f06-rt', S2, [1730, 494, 262, 660], 10)
        GG.ring('#f06-rp', S2, [1656, 878, 212, 336], 8)

        // Undrawn rings still show a round-cap dot, so keep each ring hidden until its stroke starts.
        const rings = ['#f06-r1', '#f06-r2', '#f06-r3', '#f06-rt', '#f06-rp']
        tl.set(rings, { opacity: 0 }, 0)
        const draw = (sel, t, dur) => {
          tl.set(sel, { opacity: 1 }, t)
          GG.draw(tl, sel, t, dur)
        }

        GG.head(tl, '#f06-col', 0.3)

        // f6a — the laptop is the bot's desk

        tl.fromTo('#f06-bt', { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.3, ease: 'back.out(2.4)' }, 3.2)

        const crop = (sel, x0, y0, e, t) => {
          const e0 = e * 0.82
          const cx = x0 + 265 / e
          const cy = y0 + 220 / e
          tl.fromTo(sel, { scale: e0 / S2, x: 265 - cx * e0, y: 220 - cy * e0, transformOrigin: '0 0' }, { scale: e / S2, x: -x0 * e, y: -y0 * e, duration: 0.9, ease: 'power3.inOut', transformOrigin: '0 0' }, t)

        tl.to(['#f06-desk', '#f06-col'], { opacity: 0, y: -20, scale: 0.98, duration: 0.3, ease: 'power2.in' }, 23.3)
