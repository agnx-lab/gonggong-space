      <script>
        const tl = gsap.timeline({ paused: true })
        const pop = (sel, t, rot = 0) =>
          tl.fromTo(sel, { opacity: 0, scale: 0.3, y: 30, rotation: 0 }, { opacity: 1, scale: 1, y: 0, rotation: rot, duration: 0.4, ease: 'back.out(2.2)' }, t)
        const rise = (sel, t) =>
          tl.fromTo(sel, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.45, ease: 'back.out(1.6)' }, t)
        const node = (sel, t) => {
          tl.to(`${sel} i`, { borderColor: '#d23b2a', scale: 1.25, duration: 0.3, ease: 'back.out(2.4)' }, t)
          tl.to(`${sel} span`, { color: '#1d1d1f', duration: 0.3 }, t)
        }

        // f1a — the ops person asks for a blue button
        tl.fromTo('#f01-tline', { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 0.2)
        tl.set('#f01-tfill', { scaleX: 0 }, 0)
        rise('#f01-p1', 0.6)
        node('#f01-t1', 0.7)
        pop('#f01-b1', 1.4, -2)

        // f1b — the request gets retold, mutating at each hand-off
        const hands = [
          ['#f01-p2', '#f01-a1', '#f01-b2', 3.95, 3, 0.25],
          ['#f01-p3', '#f01-a2', '#f01-b3', 5.6, -5, 0.5],
          ['#f01-p4', '#f01-a3', '#f01-b4', 7.0, 8, 1],
        ]
        hands.forEach(([p, a, b, t, rot, fill], i) => {
          tl.fromTo(a, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, ease: 'power2.out' }, t - 0.1)
          rise(p, t)
          pop(b, t + 0.35, rot)
          tl.fromTo(`${b} span`, { skewX: 0 }, { skewX: -6 * (i + 1), duration: 0.4, ease: 'power2.out' }, t + 0.5)
          tl.to(['#f01-b1', '#f01-b2', '#f01-b3'][i], { opacity: 0.4, duration: 0.3 }, t + 0.35)
          tl.to('#f01-tfill', { scaleX: fill, duration: 0.6, ease: 'power2.inOut' }, t)
        })
        node('#f01-t2', 5.9)
        node('#f01-t3', 7.4)

        // f1c — three days later something else ships; error buzz at 11.0
        GG.enter(tl, '#f01-res', 8.5)
        tl.fromTo('#f01-res .chip', { scale: 1 }, { scale: 1.2, duration: 0.2, yoyo: true, repeat: 1, ease: 'sine.inOut', immediateRender: false }, 9.24)
        tl.to('#f01-x1', { strokeDashoffset: 0, duration: 0.18, ease: 'power2.out' }, 11.0)
        tl.to('#f01-x2', { strokeDashoffset: 0, duration: 0.18, ease: 'power2.out' }, 11.12)
        tl.fromTo('#f01-res', { x: 0 }, { x: 14, duration: 0.05, yoyo: true, repeat: 5, ease: 'none', immediateRender: false }, 11.0)
        tl.fromTo('#f01-nope', { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(2.2)' }, 11.2)
        tl.to('#f01-b1', { opacity: 1, duration: 0.25 }, 11.3)
        tl.fromTo('#f01-b1', { scale: 1 }, { scale: 1.12, duration: 0.25, yoyo: true, repeat: 1, ease: 'sine.inOut', immediateRender: false }, 11.3)

        // f1d — mascot sighs; everyone else greys out
        tl.to(['#f01-p1', '#f01-p2', '#f01-p3', '#f01-p4', '#f01-b1', '#f01-b2', '#f01-b3', '#f01-b4', '#f01-tline', '#f01-root .arr'],
          { filter: 'grayscale(1)', opacity: 0.35, duration: 0.5, ease: 'power2.out' }, 12.55)
        GG.cameo(tl, '#f01-cam', 12.77, 16.26)

        // outro
        tl.to(['#f01-tline', '#f01-root .who', '#f01-root .bub', '#f01-root .arr', '#f01-res', '#f01-x', '#f01-nope'],
          { opacity: 0, y: -16, scale: 0.98, duration: 0.3, ease: 'power2.in' }, 16.31)

        window.__timelines = window.__timelines || {}

        window.__timelines['f01'] = tl
      </script>
