<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>共工 · 插件与创作（评审稿）</title>
<style>
:root{
  --window-bg:#f5f5f5;--content-bg:#fff;--sidebar-bg:#ececec;--group-bg:#0000000a;
  --label:#000000d9;--label-secondary:#00000094;--label-tertiary:#00000042;--separator:#0000001a;
  --control-fill:#fff;--control-fill-pressed:#ebebeb;--control-track:#00000017;--control-stroke:#00000024;
  --accent:#0088ff;--accent-text:#006bd6;--accent-fill:#0071e3;--on-accent:#fff;--focus-ring:#0080f0;
  --selection-fill:#0000000f;--glass-fill:#ffffffb8;
  --system-green:#34c759;--system-orange:#ff8d28;--system-red:#ff383c;--system-purple:#cb30e0;--system-indigo:#6155f5;--system-teal:#00c3d0;
  --bubble-in:#f0f0f2;--bubble-out:#dbeaff;--quote-fill:#0000000d;
  --tint-blue:#e0efff;--tint-blue-text:#0060c0;--tint-green:#e2f5e7;--tint-green-text:#1a7a36;--tint-orange:#ffefdf;--tint-orange-text:#a34a00;
  --tint-red:#ffe6e5;--tint-red-text:#c01f1c;--tint-purple:#f4e6fa;--tint-purple-text:#8a2bb3;--tint-gray:#ececef;--tint-gray-text:#5c5c61;
  --avatar-1:#1f6fd1;--avatar-2:#1d7f45;--avatar-3:#b04e17;--avatar-5:#7a3fd1;--avatar-6:#0e7a82;
  --row-alt:#00000008;--scrim:#00000026;
  --shadow-window:0 0 0 .5px rgba(0,0,0,.18),0 22px 70px 4px rgba(0,0,0,.3);
  --shadow-control:0 0 0 .5px rgba(0,0,0,.1),0 .5px 1.5px rgba(0,0,0,.18);
  --shadow-menu:inset 0 1px 0 rgba(255,255,255,.9),0 0 0 .5px rgba(0,0,0,.16),0 12px 32px rgba(0,0,0,.2);
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:#dcdde1;font-family:var(--font-sans);font-size:13px;line-height:16px;color:var(--label);-webkit-font-smoothing:antialiased}
a{color:var(--accent-text);text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
.page{padding:20px 24px 40px;max-width:1360px;margin:0 auto}
.review-head{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.review-head h1{font-size:17px;line-height:22px;margin:0;font-weight:600}
.review-head .sub{color:var(--label-secondary);font-size:12px}
.seg{display:inline-flex;background:var(--control-track);border-radius:999px;padding:2px;gap:2px}
.seg button{height:24px;padding:0 12px;border-radius:999px;color:var(--label);font-size:12px;white-space:nowrap}
.seg button.on{background:var(--control-fill);box-shadow:var(--shadow-control);font-weight:600}
.note{margin:0 0 14px;padding:10px 14px;border-radius:12px;background:#fffbe6;border:1px solid #f1e3a0;font-size:12px;line-height:18px;color:#5b4a00}
.note b{color:#3d3100}
.win{height:740px;display:flex;border-radius:14px;background:var(--window-bg);box-shadow:var(--shadow-window);overflow:hidden;position:relative}
/* sidebar */
.side{width:232px;flex:none;background:var(--sidebar-bg);border-right:1px solid var(--separator);display:flex;flex-direction:column}
.side .traffic{display:flex;gap:8px;padding:18px 16px 12px}
.side .traffic i{width:12px;height:12px;border-radius:50%;display:block}
.side .search{margin:0 12px 10px;height:24px;border-radius:999px;background:var(--control-track);display:flex;align-items:center;padding:0 10px;color:var(--label-tertiary);font-size:12px}
.side .sec{padding:8px 16px 4px;font-size:11px;color:var(--label-secondary);font-weight:600}
.conv{display:flex;gap:10px;align-items:center;margin:0 8px;padding:8px;border-radius:8px}
.conv.on{background:var(--selection-fill)}
.conv .t{font-weight:600;font-size:13px}
.conv .p{font-size:11px;color:var(--label-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;margin-top:2px}
.av{flex:none;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px}
.av.r{border-radius:50%}
.av.s{width:24px;height:24px;font-size:11px;border-radius:6px}
.av.s.r{border-radius:50%}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--content-bg)}
.bar{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--separator)}
.bar .title{font-weight:700}
.bar .meta{color:var(--label-secondary);font-size:12px}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;background:var(--control-fill);box-shadow:var(--shadow-control);font-size:12px;white-space:nowrap}
.chip.ghost{background:var(--group-bg);box-shadow:none}
.chip .dot{width:6px;height:6px;border-radius:50%}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap}
.tag.blue{background:var(--tint-blue);color:var(--tint-blue-text)}
.tag.green{background:var(--tint-green);color:var(--tint-green-text)}
.tag.orange{background:var(--tint-orange);color:var(--tint-orange-text)}
.tag.red{background:var(--tint-red);color:var(--tint-red-text)}
.tag.purple{background:var(--tint-purple);color:var(--tint-purple-text)}
.tag.gray{background:var(--tint-gray);color:var(--tint-gray-text)}
.body{flex:1;min-height:0;display:flex}
.chat{flex:1;min-width:0;display:flex;flex-direction:column}
.msgs{flex:1;overflow:auto;padding:16px 20px 8px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg .who{font-size:12px;color:var(--label-secondary);margin-bottom:4px;display:flex;gap:6px;align-items:center}
.msg .who b{color:var(--label);font-weight:600}
.bubble{background:var(--bubble-in);border-radius:5px 16px 16px 16px;padding:8px 12px;line-height:19px;max-width:520px}
.notice{align-self:center;font-size:11px;color:var(--label-secondary);background:var(--group-bg);padding:3px 10px;border-radius:999px}
.mention{color:var(--accent-text);font-weight:500}
/* cards */
.card{width:440px;background:var(--content-bg);border:1px solid var(--separator);border-radius:12px;overflow:hidden}
.card .hd{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--separator)}
.card .hd .ic{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.card .hd b{font-size:13px}
.card .bd{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.kv{display:grid;grid-template-columns:64px 1fr;gap:4px 8px;font-size:12px;line-height:17px}
.kv span:nth-child(odd){color:var(--label-secondary)}
.card .ft{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--separator);flex-wrap:wrap;align-items:center}
.btn{height:24px;padding:0 12px;border-radius:999px;background:var(--control-fill);box-shadow:var(--shadow-control);font-size:12px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn:active{background:var(--control-fill-pressed)}
.btn.primary{background:var(--accent-fill);color:var(--on-accent);box-shadow:none}
.btn.lg{height:30px;padding:0 16px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.plain{box-shadow:none;background:none;color:var(--accent-text);padding:0 4px}
.thumb{height:176px;border-radius:8px;overflow:hidden;border:1px solid var(--separator);position:relative;cursor:pointer}
.thumb .vbadge{position:absolute;right:8px;top:8px}
.progress{height:4px;border-radius:999px;background:var(--control-track);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px}
.stages{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--label-secondary)}
.stages span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;background:var(--label-tertiary);vertical-align:1px}
.stages span.done::before{background:var(--system-green)}
.stages span.run::before{background:var(--accent)}
/* composer */
.composer{margin:8px 16px 16px;border:1px solid var(--separator);border-radius:12px;background:var(--content-bg);box-shadow:0 1px 3px rgba(0,0,0,.05);position:relative}
.composer textarea{width:100%;border:0;resize:none;outline:none;padding:10px 12px 4px;height:46px;background:transparent}
.composer .tools{display:flex;align-items:center;gap:4px;padding:4px 8px 8px}
.tool{white-space:nowrap;height:24px;padding:0 8px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;color:var(--label-secondary);font-size:12px}
.tool:hover{background:var(--group-bg)}
.tool.create{color:var(--accent-text);background:var(--tint-blue);font-weight:600}
.tool.create.pulse{box-shadow:0 0 0 3px #0088ff40}
.hint{font-size:11px;color:var(--label-tertiary);margin-left:6px}
.popover{position:absolute;background:var(--glass-fill);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--shadow-menu);border-radius:12px;padding:6px;z-index:5}
.popover .sec{font-size:11px;color:var(--label-secondary);padding:6px 8px 4px;font-weight:600}
.popover .it{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:6px;font-size:12px}
.popover .it:hover{background:var(--accent-fill);color:#fff}
.popover .it small{color:inherit;opacity:.65;margin-left:auto}
/* workbench */
.wb{width:560px;flex:none;border-left:1px solid var(--separator);display:flex;flex-direction:column;background:var(--window-bg)}
.wb .tabs{height:36px;display:flex;align-items:flex-end;gap:2px;padding:0 8px;border-bottom:1px solid var(--separator)}
.wb .tabs span{padding:7px 12px;font-size:12px;border-radius:8px 8px 0 0;color:var(--label-secondary)}
.wb .tabs span.on{background:var(--content-bg);color:var(--label);font-weight:600;border:1px solid var(--separator);border-bottom-color:var(--content-bg);margin-bottom:-1px}
.wb .tb{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--content-bg);border-bottom:1px solid var(--separator);flex-wrap:wrap}
.stage{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;gap:10px}
.frame{flex:1;min-width:0;background:#fff;border-radius:8px;box-shadow:var(--shadow-control);position:relative;overflow:hidden}
.frame.annot{cursor:crosshair;outline:2px solid #ff8d2866}
.frame .cap{position:absolute;left:8px;top:8px;z-index:3}
.pin{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50% 50% 50% 2px;background:var(--system-orange);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:4}
.pin.res{background:var(--label-tertiary)}
.pin.sel{outline:3px solid #ff8d2855}
.hl{position:absolute;border:2px dashed var(--system-orange);border-radius:6px;background:#ff8d2812;pointer-events:none;z-index:2}
.comments{width:200px;flex:none;display:flex;flex-direction:column;gap:8px}
.cm{background:var(--content-bg);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow-control);font-size:12px;line-height:17px}
.cm.res{opacity:.55}
.cm .h{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:11px;color:var(--label-secondary)}
.cm .n{width:16px;height:16px;border-radius:50%;background:var(--system-orange);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.cm.res .n{background:var(--label-tertiary)}
.cm textarea{width:100%;height:48px;border:1px solid var(--separator);border-radius:6px;padding:4px 6px;resize:none;outline:none;font-size:12px}
.wb .foot{padding:10px 12px;background:var(--content-bg);border-top:1px solid var(--separator);display:flex;align-items:center;gap:8px}
/* mock landing page */
.lp{font-family:var(--font-sans);color:#1d1d1f;height:100%;display:flex;flex-direction:column;background:#fbfbfd}
.lp .nav{display:flex;align-items:center;gap:14px;padding:12px 18px;font-size:11px;color:#424245}
.lp .nav b{font-size:13px;color:#1d1d1f;margin-right:auto}
.lp .hero{padding:18px 18px 10px;text-align:center}
.lp .hero h2{margin:0 0 6px;font-size:24px;line-height:28px;letter-spacing:-.5px}
.lp .hero p{margin:0 auto 12px;font-size:12px;color:#6e6e73;max-width:300px;line-height:17px}
.lp .cta{display:inline-flex;gap:8px}
.lp .cta span{height:26px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;font-size:11px}
.lp .shot{margin:12px 18px 0;height:120px;border-radius:12px 12px 0 0;background:linear-gradient(135deg,var(--c1),var(--c2));position:relative;overflow:hidden}
.lp .shot::after{content:"";position:absolute;left:12%;right:12%;top:18px;bottom:0;background:rgba(255,255,255,.85);border-radius:8px 8px 0 0}
.lp .feat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 18px}
.lp .feat div{background:#fff;border-radius:8px;padding:8px;font-size:10px;line-height:13px;color:#6e6e73;box-shadow:0 0 0 .5px #0000001a}
.lp .feat b{display:block;color:#1d1d1f;font-size:11px;margin-bottom:2px}
.mini{transform:scale(.62);transform-origin:top left;width:161%;height:161%;pointer-events:none}
/* sheet */
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;z-index:20}
.sheet{margin-top:52px;width:880px;height:600px;background:var(--content-bg);border-radius:0 0 14px 14px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--separator)}
.sheet .sh h3{margin:0;font-size:15px;line-height:20px;font-weight:600}
.sheet .sb{flex:1;min-height:0;display:flex}
.steps{width:168px;flex:none;border-right:1px solid var(--separator);padding:12px 8px;display:flex;flex-direction:column;gap:2px;background:var(--window-bg)}
.steps button{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;text-align:left;font-size:12px}
.steps button.on{background:var(--accent-fill);color:#fff}
.steps button .n{width:18px;height:18px;border-radius:50%;background:var(--control-track);font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.steps button.on .n{background:#ffffff40}
.steps button.done .n{background:var(--system-green);color:#fff}
.steps button small{display:block;font-size:11px;opacity:.7;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px}
.pane{flex:1;min-width:0;overflow:auto;padding:16px 20px}
.pane h4{margin:0 0 4px;font-size:13px}
.pane .desc{color:var(--label-secondary);font-size:12px;margin-bottom:12px}
.grid{display:grid;gap:10px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.opt{border:1px solid var(--separator);border-radius:10px;padding:10px;text-align:left;background:var(--content-bg);position:relative}
.opt:hover{border-color:#00000033}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 2px #0088ff40}
.opt.off{opacity:.5}
.opt b{display:block;font-size:12px;margin-top:6px}
.opt small{display:block;color:var(--label-secondary);font-size:11px;line-height:15px;margin-top:2px}
.opt .pv{height:84px;border-radius:6px;overflow:hidden;background:var(--group-bg)}
.opt .check{position:absolute;right:8px;top:8px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;display:none;align-items:center;justify-content:center}
.opt.on .check{display:flex}
.big-ic{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px}
.sw{display:flex;gap:3px;margin-top:6px}
.sw i{flex:1;height:16px;border-radius:4px;display:block}
.form{display:grid;grid-template-columns:110px 1fr;gap:12px 12px;align-items:start;max-width:560px}
.form label{text-align:right;color:var(--label-secondary);padding-top:4px;font-size:12px}
.field{height:26px;border-radius:8px;border:1px solid var(--separator);padding:0 8px;width:100%;outline:none;background:var(--content-bg)}
textarea.field{height:64px;padding:6px 8px;resize:none;line-height:17px}
.field:focus{box-shadow:0 0 0 3px #0080f055;border-color:var(--focus-ring)}
.drop{border:1px dashed #00000033;border-radius:8px;padding:10px;color:var(--label-secondary);font-size:12px;display:flex;align-items:center;gap:8px}
.switch{width:32px;height:18px;border-radius:999px;background:var(--control-track);position:relative;flex:none}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:var(--shadow-control);transition:left .15s}
.switch.on{background:var(--system-green)}
.switch.on::after{left:16px}
.inline-warn{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--tint-orange);color:var(--tint-orange-text);font-size:12px}
.inline-warn.red{background:var(--tint-red);color:var(--tint-red-text)}
.inline-ok{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--tint-green);color:var(--tint-green-text);font-size:12px}
.botrow{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--separator);border-radius:10px;cursor:pointer}
.botrow.on{border-color:var(--accent);box-shadow:0 0 0 2px #0088ff40}
.botrow.off{opacity:.55;cursor:not-allowed}
.summary{width:250px;flex:none;border-left:1px solid var(--separator);padding:14px 16px;background:var(--window-bg);display:flex;flex-direction:column;gap:10px;overflow:auto}
.summary h5{margin:0;font-size:12px;color:var(--label-secondary);font-weight:600}
.summary .box{background:var(--content-bg);border-radius:10px;padding:10px;box-shadow:var(--shadow-control);font-size:12px;line-height:18px}
.summary code{font-family:var(--font-mono);font-size:11px;background:var(--group-bg);padding:1px 4px;border-radius:4px}
.sheet .sf{display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--separator)}
/* settings */
.settings{flex:1;overflow:auto;padding:20px 28px;background:var(--window-bg)}
.settings h3{font-size:15px;margin:0 0 4px;font-weight:600}
.gbox{background:var(--content-bg);border-radius:10px;box-shadow:0 0 0 .5px #0000001a;margin:8px 0 18px}
.grow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--separator)}
.grow:first-child{border-top:0}
.grow .info{flex:1;min-width:0}
.grow .info b{font-size:13px}
.grow .info small{display:block;color:var(--label-secondary);font-size:11px;margin-top:2px;line-height:15px}
.market{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mk{background:var(--content-bg);border-radius:12px;overflow:hidden;box-shadow:0 0 0 .5px #0000001a;display:flex;flex-direction:column}
.mk .pv{height:96px}
.mk .in{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.mk .in small{color:var(--label-secondary);font-size:11px;line-height:15px}
.mk .act{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:6px}
.subtle{color:var(--label-secondary);font-size:12px}
.ann{position:absolute;z-index:30;pointer-events:none}
.ann span{display:inline-block;background:#ff2d55;color:#fff;font-size:11px;line-height:15px;padding:3px 8px;border-radius:6px;max-width:220px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.show-ann .ann{display:block}.ann{display:none}
</style>
</head>
<body>
<div class="page" id="app"></div>
<script>
const PLUGINS = {
  web:{name:'网页原型',ic:'▦',color:'var(--avatar-1)',desc:'落地页、官网、活动页'},
  deck:{name:'演示文稿',ic:'▤',color:'var(--avatar-3)',desc:'汇报、路演、周报'},
  poster:{name:'海报与社媒图',ic:'◩',color:'var(--avatar-5)',desc:'海报、长图、轮播图'},
  dash:{name:'数据看板',ic:'▥',color:'var(--avatar-2)',desc:'指标看板、运营报表'},
  video:{name:'动效视频',ic:'▶',color:'var(--avatar-6)',desc:'产品宣传、片头片尾',beta:true},
};
